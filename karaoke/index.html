<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Canciones</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .search-section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-input-group {
            flex: 1;
            min-width: 250px;
            display: flex;
            gap: 10px;
        }

        .search-input-group input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        .search-input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-btn {
            padding: 12px 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .search-btn:active {
            transform: translateY(0);
        }

        .search-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .open-mode-select {
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.9em;
            color: #444;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
            min-width: 190px;
        }

        .open-mode-select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.1em;
            padding: 20px;
            display: none;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .results-info {
            color: white;
            margin-bottom: 20px;
            font-size: 1.1em;
            display: none;
        }

        .results-info.active {
            display: block;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .song-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .song-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .song-image {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #f0f0f0;
            overflow: hidden;
            position: relative;
        }

        .song-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .song-image .play-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .song-card:hover .play-icon {
            opacity: 1;
        }

        .play-icon::after {
            content: '▶';
            color: #667eea;
            font-size: 1.5em;
            margin-left: 3px;
        }

        .song-info {
            padding: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .song-title {
            font-weight: 700;
            font-size: 1em;
            color: #333;
            margin-bottom: 6px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .song-artist {
            font-size: 0.85em;
            color: #666;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .song-meta {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            font-size: 0.8em;
            margin-top: auto;
        }

        .badge {
            padding: 4px 8px;
            background: #f0f0f0;
            border-radius: 4px;
            color: #666;
            font-weight: 500;
        }

        .badge.level-easy {
            background: #c8e6c9;
            color: #2e7d32;
        }

        .badge.level-medium {
            background: #ffe0b2;
            color: #e65100;
        }

        .badge.level-hard {
            background: #ffcccc;
            color: #c62828;
        }

        .badge.duration {
            background: #e1f5fe;
            color: #01579b;
        }

        .badge.hits {
            background: #f3e5f5;
            color: #6a1b9a;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .error.active {
            display: block;
        }

        .no-results {
            text-align: center;
            color: white;
            padding: 40px 20px;
            font-size: 1.2em;
            display: none;
        }

        .no-results.active {
            display: block;
        }

        .recent-section {
            margin-bottom: 24px;
            display: none;
        }

        .recent-section.active {
            display: block;
        }

        .recent-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .recent-title {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 600;
        }

        .recent-manage-btn {
            font-size: 0.78em;
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            background: rgba(255, 255, 255, 0.12);
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .recent-manage-btn:hover {
            color: white;
            background: rgba(255, 255, 255, 0.24);
            transform: translateY(-1px);
        }

        .recent-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .recent-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 14px;
            background: rgba(255, 255, 255, 0.18);
            color: white;
            border-radius: 20px;
            font-size: 0.9em;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: background 0.2s, transform 0.2s;
            user-select: none;
        }

        .recent-tag:hover {
            background: rgba(255, 255, 255, 0.32);
            transform: translateY(-2px);
        }

        .recent-tag .tag-count {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 1px 7px;
            font-size: 0.78em;
            font-weight: 700;
        }

        /* --- Canciones jugadas --- */
        .played-section {
            margin-bottom: 30px;
            display: none;
        }

        .played-section.active {
            display: block;
        }

        .played-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .played-section-title {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .played-clear-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            border-radius: 6px;
            padding: 4px 12px;
            font-size: 0.8em;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .played-clear-btn:hover {
            background: rgba(255,255,255,0.28);
        }

        .played-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 14px;
        }

        .played-card {
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, background 0.2s;
            position: relative;
        }

        .played-card:hover {
            transform: translateY(-4px);
            background: rgba(255,255,255,0.2);
        }

        .played-card .played-count {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(0,0,0,0.65);
            color: #fff;
            font-size: 0.75em;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .played-card img {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
        }

        .played-card-info {
            padding: 10px 12px;
        }

        .played-card-title {
            color: white;
            font-size: 0.85em;
            font-weight: 700;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 3px;
        }

        .played-card-artist {
            color: rgba(255,255,255,0.65);
            font-size: 0.75em;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .search-section {
                flex-direction: column;
            }

            .search-input-group {
                min-width: auto;
            }

            .grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }

            .song-info {
                padding: 12px;
            }

            .song-title {
                font-size: 0.9em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎵 Buscador de Canciones</h1>
            <p>Encuentra tus canciones favoritas</p>
        </header>

        <div class="search-section">
            <div class="search-input-group">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Busca por artista, canción, palabra clave..."
                    autocomplete="off"
                >
                <button class="search-btn" id="searchBtn">Buscar</button>
            </div>
            <select class="open-mode-select" id="openMode">
                <option value="youtube">▶ YouTube</option>
                <option value="player">🎤 Player local</option>
                <option value="lingouClip">🎵 LingouClip</option>
            </select>
        </div>

        <div class="recent-section" id="recentSection">
            <div class="recent-header">
                <div class="recent-title">🕑 Búsquedas recientes</div>
                <a href="gestiobusquedas.html" class="recent-manage-btn">⚙️ Gestionar</a>
            </div>
            <div class="recent-tags" id="recentTags"></div>
        </div>

        <div class="played-section" id="playedSection">
            <div class="played-section-header">
                <span class="played-section-title">🎮 Últimas canciones jugadas</span>
                <a href="gestionjugadas.html" class="played-clear-btn" id="playedClearBtn">⚙️ Gestionar jugadas</a>
            </div>
            <div class="played-grid" id="playedGrid"></div>
        </div>

        <div class="error" id="error"></div>
        <div class="loading" id="loading">
            <span class="spinner"></span>
            Cargando canciones...
        </div>
        <div class="results-info" id="resultsInfo"></div>
        <div class="no-results" id="noResults">No se encontraron resultados. Intenta con otra búsqueda.</div>

        <div class="grid" id="grid"></div>
    </div>

    <script>
        const API_URL     = 'https://api.lingoclip.com/search';
        const STORAGE_KEY  = 'mykaraoke_recent_searches';
        const PLAYED_KEY   = 'mykaraoke_played_songs';
        const OPENMODE_KEY = 'mykaraoke_open_mode';
        const MAX_RECENT   = 15;
        const MAX_PLAYED   = 15;

        const searchInput  = document.getElementById('searchInput');
        const searchBtn    = document.getElementById('searchBtn');
        const grid         = document.getElementById('grid');
        const loading      = document.getElementById('loading');
        const error        = document.getElementById('error');
        const resultsInfo  = document.getElementById('resultsInfo');
        const noResults    = document.getElementById('noResults');
        const recentSection = document.getElementById('recentSection');
        const recentTags   = document.getElementById('recentTags');
        const playedSection = document.getElementById('playedSection');
        const playedGrid   = document.getElementById('playedGrid');

        // El borrado directo se ha trasladado a gestionjugadas.html

        document.getElementById('openMode').addEventListener('change', (e) => {
            localStorage.setItem(OPENMODE_KEY, e.target.value);
        });

        // --- Played songs (localStorage) ---
        function getPlayed() {
            try { return JSON.parse(localStorage.getItem(PLAYED_KEY)) || []; }
            catch { return []; }
        }

        function registerPlayed(song) {
            let list = getPlayed();
            const idx = list.findIndex(item => item.lyrics_id === song.lyrics_id);
            if (idx !== -1) {
                list[idx].count++;
            } else {
                list.push({
                    lyrics_id: song.lyrics_id,
                    title: song.title,
                    artist: song.artist,
                    yt_video_id: song.yt_video_id,
                    level: song.level,
                    duration: song.duration,
                    count: 1
                });
            }
            list.sort((a, b) => b.count - a.count);
            list = list.slice(0, MAX_PLAYED);
            localStorage.setItem(PLAYED_KEY, JSON.stringify(list));
            renderPlayed();
        }

        function renderPlayed() {
            const list = getPlayed();
            if (list.length === 0) {
                playedSection.classList.remove('active');
                return;
            }
            playedSection.classList.add('active');
            playedGrid.innerHTML = '';
            list.forEach(song => {
                const card = document.createElement('div');
                card.className = 'played-card';
                card.innerHTML = `
                    <img src="https://img.youtube.com/vi/${song.yt_video_id}/default.jpg" alt="${escapeHtml(song.title)}" loading="lazy">
                    <span class="played-count">▶ ${song.count}</span>
                    <div class="played-card-info">
                        <div class="played-card-title">${escapeHtml(song.title)}</div>
                        <div class="played-card-artist">${escapeHtml(song.artist)}</div>
                    </div>
                `;
                card.addEventListener('click', () => {
                    registerPlayed(song);
                    window.open(getOpenUrl(song), '_blank');
                });
                playedGrid.appendChild(card);
            });
        }

        // --- Recent searches (localStorage) ---
        function getRecent() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            } catch { return []; }
        }

        function saveRecent(list) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
        }

        function registerSearch(query) {
            const normalized = query.trim().toLowerCase();
            let list = getRecent();
            const idx = list.findIndex(item => item.q === normalized);
            if (idx !== -1) {
                list[idx].count++;
            } else {
                list.push({ q: normalized, count: 1 });
            }
            // Ordenar por hits desc y limitar a MAX_RECENT
            list.sort((a, b) => b.count - a.count);
            list = list.slice(0, MAX_RECENT);
            saveRecent(list);
            renderRecent();
        }

        function renderRecent() {
            const list = getRecent();
            if (list.length === 0) {
                recentSection.classList.remove('active');
                return;
            }
            recentSection.classList.add('active');
            recentTags.innerHTML = '';
            list.forEach(item => {
                const tag = document.createElement('span');
                tag.className = 'recent-tag';
                tag.innerHTML = `${escapeHtml(item.q)} <span class="tag-count">${item.count}</span>`;
                tag.addEventListener('click', () => {
                    searchInput.value = item.q;
                    search();
                });
                recentTags.appendChild(tag);
            });
        }

        // Permite buscar al presionar Enter
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                search();
            }
        });

        searchBtn.addEventListener('click', search);

        async function search() {
            const query = searchInput.value.trim();
            
            if (!query) {
                showError('Por favor, ingresa un término de búsqueda.');
                return;
            }

            try {
                showLoading(true);
                hideError();
                noResults.classList.remove('active');

                // Llamar al API
                const response = await fetch(`${API_URL}?q=${encodeURIComponent(query)}`);
                
                if (!response.ok) {
                    throw new Error(`Error en la búsqueda: ${response.status}`);
                }

                const data = await response.json();
                registerSearch(query);
                displayResults(data, query);

            } catch (err) {
                showError(`Error al buscar: ${err.message}`);
                console.error('Error:', err);
            } finally {
                showLoading(false);
            }
        }

        function displayResults(data, query) {
            const songs = data.lyrics?.items || [];
            const totalCount = data.lyrics?.count || 0;

            if (songs.length === 0) {
                noResults.classList.add('active');
                grid.innerHTML = '';
                resultsInfo.innerHTML = '';
                resultsInfo.classList.remove('active');
                return;
            }

            grid.innerHTML = '';
            resultsInfo.classList.add('active');
            resultsInfo.innerHTML = `Se encontraron <strong>${totalCount}</strong> resultado${totalCount !== 1 ? 's' : ''} para "<strong>${query}</strong>"`;

            songs.forEach(song => {
                const card = createSongCard(song);
                grid.appendChild(card);
            });
        }

        function getOpenUrl(song) {
            const mode = document.getElementById('openMode').value;
            const lingouClipUrl = `https://lingoclip.app/lyrics/${song.lyrics_id}#game`;
            if (mode === 'youtube') {
                return `https://www.youtube.com/watch?v=${song.yt_video_id}`;
            } else if (mode === 'player') {
                return `player.html?url=${encodeURIComponent(lingouClipUrl)}`;
            } else {
                return lingouClipUrl;
            }
        }

        function createSongCard(song) {
            const card = document.createElement('div');
            card.className = 'song-card';
            
            const imageUrl = `https://img.youtube.com/vi/${song.yt_video_id}/default.jpg`;
            const duration = formatDuration(song.duration);
            const levelClass = `level-${song.level}`;
            const levelText = song.level.charAt(0).toUpperCase() + song.level.slice(1);

            card.innerHTML = `
                <div class="song-image">
                    <img src="${imageUrl}" alt="${song.title}" loading="lazy">
                    <div class="play-icon"></div>
                </div>
                <div class="song-info">
                    <div class="song-title">${escapeHtml(song.title)}</div>
                    <div class="song-artist">${escapeHtml(song.artist)}</div>
                    <div class="song-meta">
                        <span class="badge duration">${duration}</span>
                        <span class="badge ${levelClass}">${levelText}</span>
                        <span class="badge hits">${formatHits(song.hits)} hits</span>
                    </div>
                </div>
            `;

            card.addEventListener('click', () => {
                registerPlayed(song);
                window.open(getOpenUrl(song), '_blank');
            });

            return card;
        }

        function formatDuration(ms) {
            if (!ms) return '0:00';
            const seconds = Math.floor(ms / 1000);
            const minutes = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${minutes}:${secs.toString().padStart(2, '0')}`;
        }

        function formatHits(hits) {
            if (hits >= 1000000) {
                return (hits / 1000000).toFixed(1) + 'M';
            } else if (hits >= 1000) {
                return (hits / 1000).toFixed(1) + 'K';
            }
            return hits.toString();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showLoading(show) {
            loading.classList.toggle('active', show);
            searchBtn.disabled = show;
        }

        function showError(message) {
            error.textContent = message;
            error.classList.add('active');
        }

        function hideError() {
            error.classList.remove('active');
        }

        // Inicialización
        window.addEventListener('load', () => {
            const savedMode = localStorage.getItem(OPENMODE_KEY);
            if (savedMode) document.getElementById('openMode').value = savedMode;
            renderRecent();
            renderPlayed();
            searchInput.focus();
        });
    </script>
</body>
</html>
