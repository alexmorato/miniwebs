<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar Búsquedas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: white;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.25);
            transition: all 0.2s ease;
            font-size: 0.95em;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateX(-3px);
        }

        .title-section h1 {
            font-size: 1.8em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            font-weight: 700;
        }

        .panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
        }

        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            color: white;
            font-size: 1em;
            transition: all 0.3s ease;
            outline: none;
        }

        .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .search-box input:focus {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
        }

        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.95em;
            opacity: 0.7;
        }

        .meta-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.8);
        }

        .clear-all-btn {
            background: none;
            border: none;
            color: #ff6b6b;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95em;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .clear-all-btn:hover:not(:disabled) {
            background: rgba(255, 107, 107, 0.15);
            color: #ff8787;
        }

        .clear-all-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .search-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 450px;
            overflow-y: auto;
            padding-right: 5px;
        }

        /* Custom Scrollbar for list */
        .search-list::-webkit-scrollbar {
            width: 6px;
        }
        .search-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        .search-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        .search-list::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }

        .search-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            transition: all 0.2s ease;
            animation: fadeIn 0.3s ease;
        }

        .search-item:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .search-item-info {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0; /* Ensures overflow text-overflow works */
        }

        .search-query {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 280px;
            color: #ffffff;
        }

        .search-count {
            font-size: 0.78em;
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            white-space: nowrap;
        }

        .delete-btn {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.2);
            color: #ff8787;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.85em;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .delete-btn:hover {
            background: #ff6b6b;
            color: white;
            border-color: #ff6b6b;
            box-shadow: 0 2px 8px rgba(255, 107, 107, 0.3);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .empty-state.active {
            display: flex;
        }

        .empty-icon {
            font-size: 3em;
            opacity: 0.8;
            animation: bounce 2s infinite;
        }

        .empty-text {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.05em;
        }

        /* Modal styling */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: #252438;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 24px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal {
            transform: scale(1);
        }

        .modal-title {
            font-size: 1.25em;
            font-weight: 700;
            margin-bottom: 12px;
            color: white;
        }

        .modal-desc {
            font-size: 0.95em;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn-cancel {
            padding: 10px 16px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-confirm {
            padding: 10px 16px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-confirm:hover {
            background: #ff5252;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            .container {
                margin: 20px auto;
            }
            .panel {
                padding: 16px;
            }
            .search-query {
                max-width: 160px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="title-section">
                <h1>Búsquedas</h1>
            </div>
            <a href="index.html" class="back-btn">⬅️ Volver</a>
        </header>

        <div class="panel">
            <div id="contentSection">
                <div class="search-box">
                    <input type="text" id="filterInput" placeholder="Filtrar búsquedas..." autocomplete="off">
                </div>

                <div class="meta-info">
                    <span id="resultsCount">Cargando búsquedas...</span>
                    <button class="clear-all-btn" id="clearAllBtn">🗑️ Borrar todo</button>
                </div>

                <div class="search-list" id="searchList"></div>
            </div>

            <div class="empty-state" id="emptyState">
                <div class="empty-icon">🔍</div>
                <div class="empty-text">No tienes búsquedas recientes guardadas.</div>
                <a href="index.html" class="back-btn" style="margin-top: 10px;">Comenzar a buscar</a>
            </div>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <div class="modal-title">¿Borrar todo el historial?</div>
            <div class="modal-desc">Esta acción eliminará de forma permanente todas tus búsquedas recientes registradas. No se puede deshacer.</div>
            <div class="modal-actions">
                <button class="btn-cancel" id="modalCancelBtn">Cancelar</button>
                <button class="btn-confirm" id="modalConfirmBtn">Borrar todo</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'mykaraoke_recent_searches';

        const filterInput = document.getElementById('filterInput');
        const resultsCount = document.getElementById('resultsCount');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const searchList = document.getElementById('searchList');
        const contentSection = document.getElementById('contentSection');
        const emptyState = document.getElementById('emptyState');

        // Modal Elements
        const confirmModal = document.getElementById('confirmModal');
        const modalCancelBtn = document.getElementById('modalCancelBtn');
        const modalConfirmBtn = document.getElementById('modalConfirmBtn');

        let recentSearches = [];

        function loadSearches() {
            try {
                recentSearches = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            } catch {
                recentSearches = [];
            }
        }

        function saveSearches() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(recentSearches));
        }

        function renderList() {
            const filterValue = filterInput.value.trim().toLowerCase();
            const filtered = recentSearches.filter(item => item.q.toLowerCase().includes(filterValue));

            if (recentSearches.length === 0) {
                contentSection.style.display = 'none';
                emptyState.classList.add('active');
                return;
            }

            contentSection.style.display = 'block';
            emptyState.classList.remove('active');

            searchList.innerHTML = '';
            
            if (filtered.length === 0) {
                searchList.innerHTML = '<div style="text-align: center; padding: 20px; color: rgba(255,255,255,0.6);">No se encontraron búsquedas que coincidan.</div>';
                resultsCount.textContent = '0 resultados';
                clearAllBtn.disabled = true;
                return;
            }

            clearAllBtn.disabled = false;
            resultsCount.textContent = `${filtered.length} ${filtered.length === 1 ? 'búsqueda' : 'búsquedas'}`;

            filtered.forEach(item => {
                const row = document.createElement('div');
                row.className = 'search-item';
                row.innerHTML = `
                    <div class="search-item-info">
                        <span class="search-query" title="${escapeHtml(item.q)}">${escapeHtml(item.q)}</span>
                        <span class="search-count" title="${item.count} búsquedas">${item.count}</span>
                    </div>
                    <button class="delete-btn" aria-label="Eliminar búsqueda">✕</button>
                `;

                // Add delete individual click handler
                const delBtn = row.querySelector('.delete-btn');
                delBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteItem(item.q);
                });

                searchList.appendChild(row);
            });
        }

        function deleteItem(query) {
            recentSearches = recentSearches.filter(item => item.q !== query);
            saveSearches();
            renderList();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Event Listeners
        filterInput.addEventListener('input', renderList);

        clearAllBtn.addEventListener('click', () => {
            confirmModal.classList.add('active');
        });

        modalCancelBtn.addEventListener('click', () => {
            confirmModal.classList.remove('active');
        });

        // Close modal if clicking outside the modal content
        confirmModal.addEventListener('click', (e) => {
            if (e.target === confirmModal) {
                confirmModal.classList.remove('active');
            }
        });

        modalConfirmBtn.addEventListener('click', () => {
            recentSearches = [];
            saveSearches();
            confirmModal.classList.remove('active');
            renderList();
        });

        // Init
        loadSearches();
        renderList();
        filterInput.focus();
    </script>
</body>
</html>
