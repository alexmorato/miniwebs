<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player</title>
  <style>
    :root {
      --bg: #0f0f14;
      --surface: #1a1a24;
      --accent2: #a78bfa;
      --border: #2e2e40;
      --bar-h: 52px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    #topbar {
      height: var(--bar-h);
      min-height: var(--bar-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      gap: 12px;
    }

    #topbar-title {
      font-family: system-ui, sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent2);
      letter-spacing: 1px;
      white-space: nowrap;
    }

    #close-btn {
      background: transparent;
      color: #ccc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 16px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      font-family: system-ui, sans-serif;
      transition: background .2s, color .2s;
      white-space: nowrap;
    }
    #close-btn:hover { background: rgba(180, 40, 40, .85); color: #fff; border-color: transparent; }

    #frame-wrap {
      flex: 1;
      padding: 12px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 10px;
      display: block;
    }
  </style>
</head>
<body>
  <div id="topbar">
    <span id="topbar-title">🎵 Mi Karaoke</span>
    <button id="close-btn" onclick="window.close()">✕ Cerrar</button>
  </div>
  <div id="frame-wrap">
    <iframe id="frame" allowfullscreen></iframe>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const url   = params.get('url');
    const title = params.get('title');

    if (title) document.title = title;
    if (url)   document.getElementById('frame').src = url;
  </script>
</body>
</html>
