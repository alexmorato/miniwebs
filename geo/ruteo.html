<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
	<title>Ruteo movil</title>
	<link rel="stylesheet" href="./leaflet/dist/leaflet.css">
	<style>
		:root {
			--bg: #0d1513;
			--panel: rgba(248, 243, 232, 0.95);
			--ink: #17221f;
			--accent: #0f7a67;
			--muted: #56625d;
			--border: #d9ccb2;
		}

		* { box-sizing: border-box; }

		html, body {
			margin: 0;
			width: 100%;
			height: 100%;
			font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
			background: var(--bg);
		}

		#map {
			position: fixed;
			inset: 0;
			width: 100%;
			height: 100%;
		}

		.distance-pill {
			position: fixed;
			top: max(12px, env(safe-area-inset-top));
			left: 50%;
			transform: translateX(-50%);
			z-index: 1000;
			background: rgba(18, 31, 27, 0.9);
			color: #ecf4f1;
			border: 1px solid rgba(255, 255, 255, 0.15);
			border-radius: 999px;
			padding: 8px 14px;
			font-weight: 800;
			letter-spacing: .01em;
			backdrop-filter: blur(6px);
		}

		.gps-center-btn {
			position: fixed;
			top: max(12px, env(safe-area-inset-top));
			right: 12px;
			z-index: 1000;
			border: 1px solid rgba(255, 255, 255, 0.2);
			background: rgba(18, 31, 27, 0.9);
			color: #ecf4f1;
			border-radius: 50%;
			width: 42px;
			height: 42px;
			padding: 0;
			font-size: 20px;
			line-height: 1;
			font-weight: 800;
			cursor: pointer;
			backdrop-filter: blur(6px);
			display: grid;
			place-items: center;
		}

		details.controls {
			position: fixed;
			left: 10px;
			right: 10px;
			bottom: max(10px, env(safe-area-inset-bottom));
			z-index: 1000;
			background: var(--panel);
			border: 1px solid var(--border);
			border-radius: 14px;
			overflow: hidden;
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
		}

		details.controls summary {
			list-style: none;
			cursor: pointer;
			padding: 10px 12px;
			font-weight: 800;
			color: var(--ink);
			display: flex;
			align-items: center;
			justify-content: space-between;
		}

		details.controls summary::-webkit-details-marker { display: none; }

		.summary-right {
			color: var(--muted);
			font-size: 12px;
			font-weight: 700;
		}

		.panel-body {
			border-top: 1px solid var(--border);
			padding: 10px;
			display: grid;
			gap: 8px;
		}

		label {
			display: block;
			margin: 0 0 4px;
			font-size: 12px;
			color: var(--muted);
			font-weight: 700;
		}

		input[type="file"],
		select,
		button {
			width: 100%;
			border: 1px solid var(--border);
			border-radius: 10px;
			background: #fff;
			color: var(--ink);
			padding: 10px;
			font: inherit;
		}

		.row {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 8px;
		}

		button {
			font-weight: 800;
			cursor: pointer;
		}

		.btn-main {
			background: linear-gradient(180deg, #11a088 0%, var(--accent) 100%);
			color: #fff;
			border-color: #0b6757;
		}

		.btn-alt {
			background: #f8f1df;
		}

		.status {
			font-size: 12px;
			color: var(--muted);
			min-height: 16px;
		}

		.toggle {
			display: flex;
			align-items: center;
			gap: 8px;
			font-size: 13px;
			font-weight: 700;
			color: var(--ink);
		}

		.toggle input[type="checkbox"] {
			width: 18px;
			height: 18px;
			margin: 0;
		}

		.osm-label {
			pointer-events: none;
			background: rgba(255, 255, 255, 0.92);
			border: 1px solid rgba(0, 0, 0, 0.15);
			border-radius: 6px;
			padding: 1px 5px;
			font-size: 11px;
			font-weight: 700;
			color: #17221f;
			white-space: nowrap;
		}

		.osm-label-tooltip {
			pointer-events: none;
			background: rgba(255, 255, 255, 0.92);
			border: 1px solid rgba(0, 0, 0, 0.15);
			border-radius: 6px;
			padding: 2px 6px;
			font-size: 11px;
			font-weight: 700;
			color: #17221f;
			box-shadow: none;
		}

		.osm-label-tooltip:before {
			display: none;
		}

		.osm-label-tooltip.peak {
			background: rgba(255, 245, 226, 0.96);
			border-color: rgba(148, 90, 24, 0.45);
		}

		.osm-label-tooltip.locality {
			background: rgba(236, 250, 235, 0.96);
			border-color: rgba(43, 126, 63, 0.4);
		}

		.osm-label-tooltip.guidepost {
			background: rgba(236, 244, 255, 0.96);
			border-color: rgba(49, 93, 158, 0.35);
		}
	</style>
</head>
<body>
	<div id="map" role="application" aria-label="Mapa principal"></div>

	<div class="distance-pill" id="distancePill">Distancia a ruta: -</div>
	<button class="gps-center-btn" id="gpsCenterBtn" type="button" aria-label="Centrar en mi posicion GPS" title="Centrar en mi posicion GPS">🎯</button>

	<details class="controls" id="controls" open>
		<summary>
			Comandos
			<span class="summary-right" id="summaryInfo">Toca para colapsar</span>
		</summary>

		<div class="panel-body">
			<div>
				<label for="routeFile">Ruta (GPX, KML, GeoJSON)</label>
				<input id="routeFile" type="file" accept=".gpx,.kml,.geojson,.json" />
			</div>

			<div>
				<label for="mapMode">Mapa base</label>
				<select id="mapMode">
					<option value="osm" selected>Online OSM (para cachear)</option>
					<option value="osmxml">OSM XML local (sin tiles)</option>
				</select>
			</div>

			<div>
				<label for="osmFile">Archivo OSM XML opcional (.osm/.xml)</label>
				<input id="osmFile" type="file" accept=".osm,.xml" />
			</div>

			<label class="toggle" for="showLabels">
				<input id="showLabels" type="checkbox" checked>
				Mostrar nombres (lugares y vias principales)
			</label>

			<div class="row">
				<button id="startBtn" class="btn-main" type="button">Iniciar GPS</button>
				<button id="stopBtn" class="btn-alt" type="button">Detener GPS</button>
			</div>

			<div class="status" id="status">Listo</div>
		</div>
	</details>

	<script>
		const FALLBACK_CONFIG = {
			defaults: {
				gpxPath: "./gpx/nuria-coma-de-vaca-queralbs.gpx",
				osmPath: "./mapa/map.osm",
				mapMode: "osm"
			},
			labels: {
				uniqueCap: 380,
				places: {
					city: { priority: 6, minZoom: 10, emoji: "" },
					town: { priority: 5, minZoom: 11, emoji: "" },
					village: { priority: 4, minZoom: 12, emoji: "" },
					hamlet: { priority: 4, minZoom: 12, emoji: "" },
					locality: { priority: 4, minZoom: 12, emoji: "🏡 " }
				},
				naturals: {
					peak: { priority: 4, minZoom: 12, emoji: "⛰️ " },
					saddle: { priority: 4, minZoom: 12, emoji: "" }
				},
				guidepost: { priority: 1, minZoom: 15, emoji: "⬆️ " },
				poi: { priority: 2, minZoom: 13, emoji: "" },
				visibility: {
					visibleCap: 220,
					cellByZoom: { base: 66, z14: 54, z16: 42 },
					scoreBonuses: { peak: 2, locality: 1, guidepost: 0 }
				}
			},
			ways: {
				render: {
					defaultColor: "#596965",
					defaultWeight: 2,
					waterway: { color: "#3e7db2", weight: 2 },
					railway: { color: "#282828", weight: 2 },
					pathTrack: { color: "#9a6d2a", weight: 2 },
					motorwayTrunk: { weight: 3 }
				},
				named: {
					includeHighways: ["motorway", "trunk", "primary", "secondary", "tertiary", "path", "track"],
					defaultMinZoom: 14,
					railOrWaterMinZoom: 14,
					minZoomByHighway: {
						motorway: 12,
						trunk: 12,
						primary: 13,
						secondary: 13,
						tertiary: 14,
						path: 15,
						track: 15
					},
					defaultPriority: 2,
					priorityByHighway: {
						motorway: 3,
						trunk: 3
					}
				}
			}
		};

		function mergeConfig(base, override) {
			if (Array.isArray(base)) {
				return Array.isArray(override) ? override : base;
			}
			if (!base || typeof base !== "object") {
				return override === undefined ? base : override;
			}
			const out = { ...base };
			if (!override || typeof override !== "object") {
				return out;
			}
			for (const key of Object.keys(override)) {
				out[key] = key in base ? mergeConfig(base[key], override[key]) : override[key];
			}
			return out;
		}

		async function loadRuntimeConfig() {
			try {
				const res = await fetch("./config.json", { cache: "no-cache" });
				if (!res.ok) return FALLBACK_CONFIG;
				const parsed = await res.json();
				return mergeConfig(FALLBACK_CONFIG, parsed);
			} catch {
				return FALLBACK_CONFIG;
			}
		}

		async function loadLeaflet() {
			function addCss(href) {
				return new Promise((resolve, reject) => {
					const link = document.createElement("link");
					link.rel = "stylesheet";
					link.href = href;
					link.onload = resolve;
					link.onerror = reject;
					document.head.appendChild(link);
				});
			}

			function addJs(src) {
				return new Promise((resolve, reject) => {
					const script = document.createElement("script");
					script.src = src;
					script.onload = resolve;
					script.onerror = reject;
					document.body.appendChild(script);
				});
			}

			try {
				await addJs("./leaflet/dist/leaflet.js");
			} catch {
				await Promise.all([
					addCss("https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"),
					addJs("https://unpkg.com/leaflet@1.9.4/dist/leaflet.js")
				]);
			}
		}

		async function initApp() {
			const appConfig = await loadRuntimeConfig();
			const controlsEl = document.getElementById("controls");
			const summaryInfoEl = document.getElementById("summaryInfo");
			const routeFileEl = document.getElementById("routeFile");
			const mapModeEl = document.getElementById("mapMode");
			const osmFileEl = document.getElementById("osmFile");
			const showLabelsEl = document.getElementById("showLabels");
			const startBtn = document.getElementById("startBtn");
			const stopBtn = document.getElementById("stopBtn");
			const gpsCenterBtn = document.getElementById("gpsCenterBtn");
			const statusEl = document.getElementById("status");
			const distancePillEl = document.getElementById("distancePill");

			const placeRules = appConfig.labels.places;
			const naturalRules = appConfig.labels.naturals;
			const guidepostRule = appConfig.labels.guidepost;
			const poiRule = appConfig.labels.poi;
			const labelVisibility = appConfig.labels.visibility;
			const wayRender = appConfig.ways.render;
			const namedWayConfig = appConfig.ways.named;
			const defaultsConfig = appConfig.defaults;

			const iv = defaultsConfig.initialView || { lat: 42.35, lng: 2.17, zoom: 12 };
			const map = L.map("map", { zoomControl: true }).setView([iv.lat, iv.lng], iv.zoom);
			mapModeEl.value = appConfig.defaults.mapMode;

			let baseLayer = null;
			let osmVectorLayer = null;
			let osmLabelLayer = null;
			let osmParsedData = null;
			let routeLine = null;
			let userMarker = null;
			let watchId = null;
			let routePoints = [];

			function setStatus(msg) {
				statusEl.textContent = msg;
			}

			function updateSummaryHint() {
				summaryInfoEl.textContent = controlsEl.open ? "Toca para colapsar" : "Toca para abrir";
			}

			function metersText(m) {
				if (!Number.isFinite(m)) return "-";
				if (m < 1000) return `${Math.round(m)} m`;
				return `${(m / 1000).toFixed(2)} km`;
			}

			function haversineMeters(lat1, lon1, lat2, lon2) {
				const R = 6371000;
				const toRad = (v) => (v * Math.PI) / 180;
				const dLat = toRad(lat2 - lat1);
				const dLon = toRad(lon2 - lon1);
				const a = Math.sin(dLat / 2) ** 2
					+ Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
				return 2 * R * Math.asin(Math.sqrt(a));
			}

			function distanceToRoute(lat, lng) {
				if (!routePoints.length) return NaN;
				let min = Infinity;
				for (const p of routePoints) {
					const d = haversineMeters(lat, lng, p.lat, p.lng);
					if (d < min) min = d;
				}
				return min;
			}

			function parseGpx(text) {
				const xml = new DOMParser().parseFromString(text, "application/xml");
				const parserError = xml.querySelector("parsererror");
				if (parserError) throw new Error("GPX invalido");
				const pts = Array.from(xml.querySelectorAll("trkpt, rtept")).map((n) => ({
					lat: Number(n.getAttribute("lat")),
					lng: Number(n.getAttribute("lon"))
				})).filter((p) => Number.isFinite(p.lat) && Number.isFinite(p.lng));
				if (pts.length < 2) throw new Error("GPX sin suficientes puntos");
				return pts;
			}

			function parseKml(text) {
				const xml = new DOMParser().parseFromString(text, "application/xml");
				const parserError = xml.querySelector("parsererror");
				if (parserError) throw new Error("KML invalido");

				const coordinatesNodes = Array.from(xml.querySelectorAll("LineString > coordinates"));
				const pts = [];
				for (const node of coordinatesNodes) {
					const lines = node.textContent.trim().split(/\s+/);
					for (const line of lines) {
						const [lon, lat] = line.split(",").map(Number);
						if (Number.isFinite(lat) && Number.isFinite(lon)) {
							pts.push({ lat, lng: lon });
						}
					}
				}
				if (pts.length < 2) throw new Error("KML sin LineString util");
				return pts;
			}

			function parseGeoJson(text) {
				const data = JSON.parse(text);
				const out = [];

				function addCoords(coords) {
					for (const c of coords) {
						if (Array.isArray(c[0])) addCoords(c);
						else {
							const [lon, lat] = c;
							if (Number.isFinite(lat) && Number.isFinite(lon)) out.push({ lat, lng: lon });
						}
					}
				}

				function scan(obj) {
					if (!obj || typeof obj !== "object") return;
					if (obj.type === "LineString" || obj.type === "MultiLineString") addCoords(obj.coordinates);
					else if (obj.type === "Feature") scan(obj.geometry);
					else if (obj.type === "FeatureCollection") for (const f of obj.features || []) scan(f);
				}

				scan(data);
				if (out.length < 2) throw new Error("GeoJSON sin linea util");
				return out;
			}

			function drawRoute() {
				if (routeLine) map.removeLayer(routeLine);
				routeLine = L.polyline(routePoints.map((p) => [p.lat, p.lng]), {
					color: "#0f7a67",
					weight: 5,
					opacity: 0.9
				}).addTo(map);
				map.fitBounds(routeLine.getBounds(), { padding: [20, 20] });
			}

			function escapeHtml(value) {
				return String(value)
					.replace(/&/g, "&amp;")
					.replace(/</g, "&lt;")
					.replace(/>/g, "&gt;")
					.replace(/\"/g, "&quot;")
					.replace(/'/g, "&#39;");
			}

			function parseOsmXmlData(text) {
				const xml = new DOMParser().parseFromString(text, "application/xml");
				const parserError = xml.querySelector("parsererror");
				if (parserError) throw new Error("OSM XML invalido");

				const nodeMap = new Map();
				const labels = [];
				for (const n of Array.from(xml.querySelectorAll("node"))) {
					const id = n.getAttribute("id");
					const lat = Number(n.getAttribute("lat"));
					const lon = Number(n.getAttribute("lon"));
					if (id && Number.isFinite(lat) && Number.isFinite(lon)) nodeMap.set(id, [lat, lon]);

					const name = n.querySelector("tag[k='name']")?.getAttribute("v");
					if (!name) continue;
					const place = n.querySelector("tag[k='place']")?.getAttribute("v") || "";
					const natural = n.querySelector("tag[k='natural']")?.getAttribute("v") || "";
					const tourism = n.querySelector("tag[k='tourism']")?.getAttribute("v") || "";
					const amenity = n.querySelector("tag[k='amenity']")?.getAttribute("v") || "";
					const leisure = n.querySelector("tag[k='leisure']")?.getAttribute("v") || "";
					const historic = n.querySelector("tag[k='historic']")?.getAttribute("v") || "";
                    const information = n.querySelector("tag[k='information']")?.getAttribute("v") || "";
                    const isGuidepost = information === "guidepost";

					const isNamedPoi = Boolean(place || natural || tourism || amenity || leisure || historic || isGuidepost);
					if (!isNamedPoi) continue;

					let priority = 1;
					let minZoom = 14;

					if (place && placeRules[place]) {
						priority = placeRules[place].priority;
						minZoom = placeRules[place].minZoom;
					} else if (natural && naturalRules[natural]) {
						priority = naturalRules[natural].priority;
						minZoom = naturalRules[natural].minZoom;
					} else if (isGuidepost) {
						priority = guidepostRule.priority;
						minZoom = guidepostRule.minZoom;
					} else if (tourism || amenity || leisure || historic) {
						priority = poiRule.priority;
						minZoom = poiRule.minZoom;
					}

					const placeEmoji = (place && placeRules[place] && placeRules[place].emoji) ? placeRules[place].emoji : "";
					const naturalEmoji = (natural && naturalRules[natural] && naturalRules[natural].emoji) ? naturalRules[natural].emoji : "";
					const guidepostEmoji = guidepostRule.emoji || "";
					let labelText = name;
					if (naturalEmoji) labelText = `${naturalEmoji}${name}`;
					else if (placeEmoji) labelText = `${placeEmoji}${name}`;
					else if (isGuidepost) labelText = `${guidepostEmoji}${name}`;

					labels.push({
						lat,
						lng: lon,
						text: labelText,
						priority,
						minZoom,
						isPeak: natural === "peak",
						isLocality: place === "locality",
						isGuidepost
					});
				}

				const ways = [];
				for (const w of Array.from(xml.querySelectorAll("way"))) {
					const tags = new Map();
					for (const t of Array.from(w.querySelectorAll("tag"))) tags.set(t.getAttribute("k"), t.getAttribute("v"));

					const isDrawable = tags.has("highway") || tags.has("railway") || tags.has("waterway");
					if (!isDrawable) continue;

					const points = [];
					for (const nd of Array.from(w.querySelectorAll("nd"))) {
						const ref = nd.getAttribute("ref");
						if (ref && nodeMap.has(ref)) points.push(nodeMap.get(ref));
					}
					if (points.length < 2) continue;

					let color = wayRender.defaultColor;
					let weight = wayRender.defaultWeight;
					if (tags.has("waterway")) {
						color = wayRender.waterway.color;
						weight = wayRender.waterway.weight;
					}
					if (tags.has("railway")) {
						color = wayRender.railway.color;
						weight = wayRender.railway.weight;
					}
					if (tags.get("highway") === "path" || tags.get("highway") === "track") {
						color = wayRender.pathTrack.color;
						weight = wayRender.pathTrack.weight;
					}
					if (tags.get("highway") === "motorway" || tags.get("highway") === "trunk") {
						weight = wayRender.motorwayTrunk.weight;
					}

					ways.push({ points, color, weight });

					const wayName = tags.get("name");
					if (wayName) {
						const h = tags.get("highway");
						const isNamedMainWay = tags.has("railway")
							|| tags.has("waterway")
							|| namedWayConfig.includeHighways.includes(h);
						if (isNamedMainWay) {
							const mid = points[Math.floor(points.length / 2)];
							let minZoom = namedWayConfig.defaultMinZoom;
							if (h && namedWayConfig.minZoomByHighway[h] !== undefined) {
								minZoom = namedWayConfig.minZoomByHighway[h];
							}
							let wayPriority = namedWayConfig.defaultPriority;
							if (h && namedWayConfig.priorityByHighway[h] !== undefined) {
								wayPriority = namedWayConfig.priorityByHighway[h];
							}
							if (tags.has("railway")) {
								minZoom = namedWayConfig.railwayMinZoom ?? namedWayConfig.railOrWaterMinZoom;
								wayPriority = namedWayConfig.railwayPriority ?? wayPriority;
							} else if (tags.has("waterway")) {
								minZoom = namedWayConfig.waterwayMinZoom ?? namedWayConfig.railOrWaterMinZoom;
								wayPriority = namedWayConfig.waterwayPriority ?? wayPriority;
							}
							const wayText = tags.has("waterway")
								? `${namedWayConfig.waterwayEmoji ?? "♒ "}${wayName}`
								: wayName;

							labels.push({
								lat: mid[0],
								lng: mid[1],
								text: wayText,
								priority: wayPriority,
								minZoom,
								isPeak: false,
								isLocality: false,
								isGuidepost: false
							});
						}
					}
				}

				if (!ways.length) throw new Error("No hay vias dibujables en el OSM XML");

				labels.sort((a, b) => b.priority - a.priority);
				const unique = [];
				const seen = new Set();
				for (const label of labels) {
					const key = `${label.text.toLowerCase()}|${label.lat.toFixed(4)}|${label.lng.toFixed(4)}`;
					if (seen.has(key)) continue;
					seen.add(key);
					unique.push(label);
					if (unique.length >= appConfig.labels.uniqueCap) break;
				}

				return { ways, labels: unique };
			}

			function getVisibleLabelsByZoomAndDensity(osmData) {
				const zoom = map.getZoom();
				const candidates = osmData.labels.filter((label) => zoom >= label.minZoom);
				if (!candidates.length) return [];

				const cell = zoom >= 16
					? labelVisibility.cellByZoom.z16
					: (zoom >= 14 ? labelVisibility.cellByZoom.z14 : labelVisibility.cellByZoom.base);
				const used = new Set();
				const output = [];
				const sorted = [...candidates].sort((a, b) => {
					const ap = a.priority
						+ (a.isPeak ? labelVisibility.scoreBonuses.peak : 0)
						+ (a.isLocality ? labelVisibility.scoreBonuses.locality : 0)
						+ (a.isGuidepost ? labelVisibility.scoreBonuses.guidepost : 0);
					const bp = b.priority
						+ (b.isPeak ? labelVisibility.scoreBonuses.peak : 0)
						+ (b.isLocality ? labelVisibility.scoreBonuses.locality : 0)
						+ (b.isGuidepost ? labelVisibility.scoreBonuses.guidepost : 0);
					return bp - ap;
				});

				for (const label of sorted) {
					const pt = map.latLngToLayerPoint([label.lat, label.lng]);
					const cx = Math.floor(pt.x / cell);
					const cy = Math.floor(pt.y / cell);

					if (used.has(`${cx}:${cy}`)) continue;
					used.add(`${cx}:${cy}`);
					output.push(label);
					if (output.length >= labelVisibility.visibleCap) break;
				}

				return output;
			}

			function renderOsmLabels(osmData) {
				if (osmLabelLayer) {
					map.removeLayer(osmLabelLayer);
				}
				osmLabelLayer = L.layerGroup();

				if (!showLabelsEl.checked) return 0;
				const labels = getVisibleLabelsByZoomAndDensity(osmData);
				function getLabelPointStyle(label) {
					if (label.isPeak) {
						return { color: "#8a4f18", fillColor: "#ffd391" };
					}
					if (label.isLocality) {
						return { color: "#2f6c3c", fillColor: "#c6efcf" };
					}
					if (label.isGuidepost) {
						return { color: "#2f5f9f", fillColor: "#cde0ff" };
					}
					return { color: "#24332f", fillColor: "#f6f6f6" };
				}

				for (const label of labels) {
					const pointStyle = getLabelPointStyle(label);
					const marker = L.circleMarker([label.lat, label.lng], {
						radius: 3,
						weight: 1.5,
						opacity: 1,
						fillOpacity: 1,
						color: pointStyle.color,
						fillColor: pointStyle.fillColor,
						interactive: false,
					});
					marker.bindTooltip(escapeHtml(label.text), {
						permanent: true,
						direction: "top",
						offset: [0, -2],
						className: label.isPeak
							? "osm-label-tooltip peak"
							: (label.isLocality
								? "osm-label-tooltip locality"
								: (label.isGuidepost ? "osm-label-tooltip guidepost" : "osm-label-tooltip"))
					});
					marker.addTo(osmLabelLayer);
				}
				osmLabelLayer.addTo(map);
				return labels.length;
			}

			function drawOsmData(osmData, fitToBounds = true) {
				if (osmVectorLayer) map.removeLayer(osmVectorLayer);
				osmVectorLayer = L.layerGroup();

				const segments = [];
				for (const way of osmData.ways) {
					const line = L.polyline(way.points, {
						color: way.color,
						weight: way.weight,
						opacity: 0.85
					});
					line.addTo(osmVectorLayer);
					segments.push(line);
				}
				osmVectorLayer.addTo(map);

				renderOsmLabels(osmData);

				const bounds = L.featureGroup(segments).getBounds();
				if (fitToBounds && bounds.isValid()) map.fitBounds(bounds, { padding: [20, 20] });
			}

			function loadRouteFromText(text, sourceExt) {
				const lower = sourceExt.toLowerCase();
				if (lower.endsWith(".gpx")) routePoints = parseGpx(text);
				else if (lower.endsWith(".kml")) routePoints = parseKml(text);
				else routePoints = parseGeoJson(text);

				drawRoute();
				distancePillEl.textContent = "Distancia a ruta: esperando GPS";
			}

			async function loadDefaultRoute() {
				const res = await fetch(appConfig.defaults.gpxPath, { cache: "no-cache" });
				if (!res.ok) throw new Error(`No se encontro ${appConfig.defaults.gpxPath}`);
				const text = await res.text();
				loadRouteFromText(text, ".gpx");
				setStatus(`Ruta por defecto cargada (${routePoints.length} puntos)`);
			}

			async function loadOsmVectorMap() {
				let text;
				if (osmFileEl.files && osmFileEl.files[0]) {
					text = await osmFileEl.files[0].text();
				} else {
					const res = await fetch(appConfig.defaults.osmPath, { cache: "no-cache" });
					if (!res.ok) throw new Error(`No se encontro ${appConfig.defaults.osmPath}`);
					text = await res.text();
				}
				osmParsedData = parseOsmXmlData(text);
				drawOsmData(osmParsedData, !routePoints.length);
				const zoom = map.getZoom();
				const shown = renderOsmLabels(osmParsedData);
				setStatus(`Mapa OSM XML cargado (${osmParsedData.ways.length} vias, etiquetas visibles ${shown}, zoom ${zoom})`);
			}

			function applyBaseMap() {
				if (baseLayer) {
					map.removeLayer(baseLayer);
					baseLayer = null;
				}
				if (osmVectorLayer) {
					map.removeLayer(osmVectorLayer);
					osmVectorLayer = null;
				}
				if (osmLabelLayer) {
					map.removeLayer(osmLabelLayer);
					osmLabelLayer = null;
				}

				if (mapModeEl.value === "osm") {
					baseLayer = L.tileLayer(defaultsConfig.tileUrl, {
						maxZoom: defaultsConfig.tileMaxZoom,
						attribution: "&copy; OpenStreetMap contributors"
					}).addTo(map);
					setStatus("Modo online OSM activo");
					return;
				}

				loadOsmVectorMap().catch((err) => setStatus(`Error OSM local: ${err.message}`));
			}

			function startGps() {
				if (!navigator.geolocation) {
					setStatus("Geolocalizacion no soportada");
					return;
				}
				if (!routePoints.length) {
					setStatus("Carga una ruta antes de iniciar GPS");
					return;
				}
				if (watchId !== null) return;

				watchId = navigator.geolocation.watchPosition((pos) => {
					const lat = pos.coords.latitude;
					const lng = pos.coords.longitude;
					const latlng = [lat, lng];

					if (!userMarker) {
						userMarker = L.circleMarker(latlng, {
							radius: 7,
							color: "#17302a",
							fillColor: "#f5fffb",
							fillOpacity: 1,
							weight: 3
						}).addTo(map);
					} else {
						userMarker.setLatLng(latlng);
					}

					const d = distanceToRoute(lat, lng);
					distancePillEl.textContent = `Distancia a ruta: ${metersText(d)}`;
				}, (err) => {
					setStatus(`Error GPS: ${err.message}`);
				}, {
					enableHighAccuracy: true,
					maximumAge: 2000,
					timeout: 10000
				});

				setStatus("GPS activo");
			}

			function stopGps() {
				if (watchId !== null) {
					navigator.geolocation.clearWatch(watchId);
					watchId = null;
				}
				setStatus("GPS detenido");
			}

			function centerMapOnLatLng(lat, lng) {
				const targetZoom = Math.max(map.getZoom(), 15);
				map.setView([lat, lng], targetZoom, { animate: true });
			}

			function centerOnUserPosition() {
				if (!navigator.geolocation) {
					setStatus("Geolocalizacion no soportada");
					return;
				}

				if (userMarker) {
					const p = userMarker.getLatLng();
					centerMapOnLatLng(p.lat, p.lng);
					setStatus("Centrado en tu ultima posicion GPS");
					return;
				}

				navigator.geolocation.getCurrentPosition((pos) => {
					const lat = pos.coords.latitude;
					const lng = pos.coords.longitude;
					const latlng = [lat, lng];

					if (!userMarker) {
						userMarker = L.circleMarker(latlng, {
							radius: 7,
							color: "#17302a",
							fillColor: "#f5fffb",
							fillOpacity: 1,
							weight: 3
						}).addTo(map);
					} else {
						userMarker.setLatLng(latlng);
					}

					centerMapOnLatLng(lat, lng);
					setStatus("Centrado en tu posicion GPS");
				}, (err) => {
					setStatus(`No se pudo centrar GPS: ${err.message}`);
				}, {
					enableHighAccuracy: true,
					maximumAge: 2000,
					timeout: 10000
				});
			}

			routeFileEl.addEventListener("change", async (e) => {
				const file = e.target.files && e.target.files[0];
				if (!file) return;

				try {
					const text = await file.text();
					loadRouteFromText(text, file.name);
					setStatus(`Ruta cargada (${routePoints.length} puntos)`);
				} catch (err) {
					setStatus(`Error al cargar ruta: ${err.message}`);
				}
			});

			mapModeEl.addEventListener("change", applyBaseMap);
			osmFileEl.addEventListener("change", () => {
				if (mapModeEl.value === "osmxml") applyBaseMap();
			});
			showLabelsEl.addEventListener("change", () => {
				if (mapModeEl.value === "osmxml" && osmParsedData) {
					const shown = renderOsmLabels(osmParsedData);
					const mode = showLabelsEl.checked ? "activadas" : "ocultas";
					setStatus(`Etiquetas ${mode} (${shown} visibles)`);
				}
			});
			map.on("zoomend", () => {
				if (mapModeEl.value === "osmxml" && osmParsedData) {
					const shown = renderOsmLabels(osmParsedData);
					setStatus(`Zoom ${map.getZoom()} - etiquetas visibles ${shown}`);
				}
			});
			startBtn.addEventListener("click", startGps);
			stopBtn.addEventListener("click", stopGps);
			gpsCenterBtn.addEventListener("click", centerOnUserPosition);
			controlsEl.addEventListener("toggle", updateSummaryHint);

			updateSummaryHint();
			applyBaseMap();
			loadDefaultRoute().catch((err) => {
				setStatus(`No se pudo cargar la ruta por defecto: ${err.message}`);
			});
		}

		loadLeaflet()
			.then(initApp)
			.catch((err) => {
				const distancePillEl = document.getElementById("distancePill");
				distancePillEl.textContent = `Error cargando Leaflet: ${err.message}`;
			});
	</script>
</body>
</html>
